[workspace]
resolver = "3"
members = ["crates/pane-proto", "crates/pane-host", "crates/pane-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rutytoi220/pane"
rust-version = "1.85"

[workspace.dependencies]
pane-proto = { path = "crates/pane-proto" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
lz4_flex = "0.14"
thiserror = "2"
crossbeam-channel = "0.5"
futures-core = "0.3"
libc = "0.2"
portable-pty = "0.9"
reis = "0.7"
vt100 = "0.18"
x11rb = { version = "0.13", default-features = false, features = ["damage", "xtest", "composite", "xfixes"] }
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
eframe = { version = "0.37", default-features = false }
egui = "0.37"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
